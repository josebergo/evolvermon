{{/* 八服务统一生成：Deployment+Service（scheduler 无 HTTP 端口仅 headless；ops-admin 仅 ClusterIP 内网） */}}
{{- $svcs := list
  (dict "name" "gateway"       "cmd" "gateway"    "port" 8080 "db" ""            "replicas" .Values.gateway.replicas       "http" true  "ingress" true)
  (dict "name" "identity"      "cmd" "identity"   "port" 8081 "db" "identity"    "replicas" .Values.identity.replicas      "http" true  "ingress" false)
  (dict "name" "core-erp"      "cmd" "core-erp"   "port" 8086 "db" "erp"         "replicas" .Values.coreErp.replicas      "http" true  "ingress" false)
  (dict "name" "core-mes"      "cmd" "core-mes"   "port" 8087 "db" "mes"         "replicas" .Values.coreMes.replicas      "http" true  "ingress" false)
  (dict "name" "core-wms"      "cmd" "core-wms"   "port" 8088 "db" "wms"         "replicas" .Values.coreWms.replicas      "http" true  "ingress" false)
  (dict "name" "master-data"   "cmd" "master-data" "port" 8085 "db" "master"     "replicas" .Values.masterData.replicas  "http" true  "ingress" false)
  (dict "name" "integration"   "cmd" "integration" "port" 8083 "db" "integration" "replicas" .Values.integration.replicas "http" true "ingress" false)
  (dict "name" "scheduler"     "cmd" "scheduler"  "port" 8084 "db" ""            "replicas" .Values.scheduler.replicas    "http" false "ingress" false)
  (dict "name" "ops-admin"     "cmd" "ops-admin"  "port" 8180 "db" "ops"        "replicas" .Values.opsAdmin.replicas     "http" true  "ingress" false)
}}
{{- range $s := $svcs }}
---
apiVersion: apps/v1
kind: {{ if eq $s.name "scheduler" }}StatefulSet{{ else }}Deployment{{ end }}
metadata:
  name: {{ $.Release.Name }}-{{ $s.name }}
  labels: {{- include "evolvermon.labels" (dict "root" $ "svc" $s.name) | nindent 4 }}
spec:
  {{- if not $.Values.autoscaling.enabled }}
  replicas: {{ $s.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "evolvermon.labels" (dict "root" $ "svc" $s.name) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "evolvermon.labels" (dict "root" $ "svc" $s.name) | nindent 8 }}
    spec:
      containers:
        - name: {{ $s.name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["./{{ $s.cmd }}"]
          {{- if $s.http }}
          ports: [{ containerPort: {{ $s.port }} }]
          {{- end }}
          env:
            - name: EM_HTTP_ADDR
              value: ":{{ $s.port }}"
            {{- if $s.db }}
            - name: EM_DATABASE_DSN
              value: {{ include "evolvermon.dsn" (dict "Values" $.Values "Release" $.Release "db" $s.db) | quote }}
            {{- end }}
            - name: EM_INTERNAL_TOKEN
              value: {{ $.Values.internalToken | quote }}
            - name: EM_JWT_SECRET
              value: {{ $.Values.jwtSecret | quote }}
            - name: EM_SEED_DEMO
              value: {{ $.Values.seedDemo | quote }}
            - name: EM_MIGRATE
              value: {{ if eq $s.name "identity" }}"1"{{ else }}"0"{{ end }}
            {{- if eq $s.name "core-erp" }}
            - name: EM_ROLES
              value: "erp"
            - name: EM_MES_URL
              value: {{ include "evolvermon.url" (dict "Release" $.Release "svc" "core-mes" "port" 8087) | quote }}
            - name: EM_WMS_URL
              value: {{ include "evolvermon.url" (dict "Release" $.Release "svc" "core-wms" "port" 8088) | quote }}
            {{- end }}
            {{- if eq $s.name "core-mes" }}
            - name: EM_ROLES
              value: "mes"
            - name: EM_ERP_URL
              value: {{ include "evolvermon.url" (dict "Release" $.Release "svc" "core-erp" "port" 8086) | quote }}
            - name: EM_WMS_URL
              value: {{ include "evolvermon.url" (dict "Release" $.Release "svc" "core-wms" "port" 8088) | quote }}
            {{- end }}
            {{- if eq $s.name "core-wms" }}
            - name: EM_ROLES
              value: "wms"
            - name: EM_ERP_URL
              value: {{ include "evolvermon.url" (dict "Release" $.Release "svc" "core-erp" "port" 8086) | quote }}
            - name: EM_MES_URL
              value: {{ include "evolvermon.url" (dict "Release" $.Release "svc" "core-mes" "port" 8087) | quote }}
            {{- end }}
            {{- if eq $s.name "integration" }}
            - name: EM_CORE_URL
              value: {{ include "evolvermon.url" (dict "Release" $.Release "svc" "core-wms" "port" 8088) | quote }}
            - name: EM_ERP_URL
              value: {{ include "evolvermon.url" (dict "Release" $.Release "svc" "core-erp" "port" 8086) | quote }}
            - name: EM_MES_URL
              value: {{ include "evolvermon.url" (dict "Release" $.Release "svc" "core-mes" "port" 8087) | quote }}
            - name: EM_WMS_URL
              value: {{ include "evolvermon.url" (dict "Release" $.Release "svc" "core-wms" "port" 8088) | quote }}
            {{- end }}
            {{- if eq $s.name "scheduler" }}
            - name: EM_MRP_AUTO_MINUTES
              value: {{ $.Values.mrpAutoMinutes | quote }}
            {{- end }}
            {{- if eq $s.name "gateway" }}
            - name: EM_IDENTITY_URL
              value: {{ include "evolvermon.url" (dict "Release" $.Release "svc" "identity" "port" 8081) | quote }}
            - name: EM_ERP_URL
              value: {{ include "evolvermon.url" (dict "Release" $.Release "svc" "core-erp" "port" 8086) | quote }}
            - name: EM_MES_URL
              value: {{ include "evolvermon.url" (dict "Release" $.Release "svc" "core-mes" "port" 8087) | quote }}
            - name: EM_WMS_URL
              value: {{ include "evolvermon.url" (dict "Release" $.Release "svc" "core-wms" "port" 8088) | quote }}
            - name: EM_OPS_URL
              value: {{ include "evolvermon.url" (dict "Release" $.Release "svc" "ops-admin" "port" 8180) | quote }}
            - name: EM_MASTER_URL
              value: {{ include "evolvermon.url" (dict "Release" $.Release "svc" "master-data" "port" 8085) | quote }}
            {{- end }}
            {{- if ne $s.name "gateway" }}
            - name: EM_IDENTITY_URL
              value: {{ include "evolvermon.url" (dict "Release" $.Release "svc" "identity" "port" 8081) | quote }}
            - name: EM_MASTER_URL
              value: {{ include "evolvermon.url" (dict "Release" $.Release "svc" "master-data" "port" 8085) | quote }}
            {{- end }}
            {{- if eq $s.name "ops-admin" }}
            - name: EM_ALERT_WEBHOOK
              value: {{ $.Values.alertWebhook | quote }}
            {{- end }}
          resources: {{- toYaml $.Values.resources | nindent 12 }}
          {{- if $s.http }}
          readinessProbe:
            httpGet: { path: /readyz, port: {{ $s.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: {{ $s.port }} }
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $s.name }}
  labels: {{- include "evolvermon.labels" (dict "root" $ "svc" $s.name) | nindent 4 }}
spec:
  {{ if $s.http }}type: ClusterIP{{ else }}clusterIP: "None"{{ end }}
  selector: {{- include "evolvermon.labels" (dict "root" $ "svc" $s.name) | nindent 4 }}
  ports:
    - port: {{ $s.port }}
      targetPort: {{ $s.port }}
{{- end }}
